server:
  port: 8084
  servlet:
    context-path: /security/v1/

spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/security_db?currentSchema=security
    username: postgres
    password: postgres

  jpa:
    database: postgresql
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

logging:
  file:
    path: ./logs
  level:
    org:
      hibernate:
        SQL: debug

# Eureka client configuration
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    info:
      env:
        enabled: true
    web:
      exposure:
        include: '*'
        base-path: /actuator